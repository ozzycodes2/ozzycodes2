<title id="t">GitHub stats</title>
<desc id="d">GitHub stats updated 2026-10-13: 1,303 contributions in 2026, 1,574 all time, 1,168 of them in private repositories, 385 pull requests merged, longest streak 6 days, 29 repositories contributed to. member since August 2016 · 5 of 11 repos public · 2 organizations. Top languages by total bytes across all 29 repositories: Scala 58.3%, Rust 17.7%, TypeScript 10.7%, Python 5.7%, Go 3.9%, Java 3.7%.</desc>
