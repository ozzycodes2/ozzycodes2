<svg xmlns="http://www.w3.org/2000/svg" width="880" height="80" viewBox="0 0 880 80" role="img" aria-labelledby="t d">
<title id="t">End of profile</title>
<desc id="d">Closing prompt: exit.</desc>
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Inter';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;font-size:16px;fill:#171717}
.display{font-size:40px;font-weight:600;letter-spacing:-0.8px}.heading{font-size:24px;font-weight:600;letter-spacing:-0.24px}.body{font-size:16px;font-weight:400}.caption{font-size:13px;font-weight:400}.mono{font-family:'SF Mono', ui-monospace, SFMono-Regular, JBM, Menlo, monospace;font-size:14px;font-weight:400}
.ink{fill:#171717}.dim{fill:#616161}.accent{fill:#cc3300}
