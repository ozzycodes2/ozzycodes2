# Hand-edited content for the profile README. Nothing here is fetched.
# Edit, push, and the Actions workflow re-renders the SVGs from it.

[identity]
name = "Osniel Quintana"
handle = "ozzycodes2"
role = "platform engineer"
# One line per rendered line. Keep each under ~72 characters or it will clip.
#
# A `*run*` anywhere in a line is set in the accent at weight 700. It is the one
# place in the window the accent touches type, and it does not clear 4.5:1 —
# keep it to a proper noun the line does not depend on.
tagline = [
  "Backend by trade, platform by habit.",
  "I build the developer tooling other engineers ship on.",
  "Wiring coding agents into *MACHINIFY*'s toolchain",
]

[city]
# Days of contribution history the skyline draws. A tile is a fixed 44x22, so a
# longer window does not shrink the blocks — it widens the plane, and the plane
# is centred for 26 weeks. Much past 182 days it runs off the right rail.
#
# The panel rounds this down to whole weeks, so 182 is the one value that both
# fills the plane OX is cut for and wastes none of the window. A full year would
# be two thirds bare ground and half of it off-frame.
window_days = 182

# `~/route`, oldest first — order here is ignored, the panel sorts by `start`.
#
# `start` and `end` are `YYYY-MM`, or `YYYY` for a year with no month. Omit `end`
# on the role still held; it is the one the accent marks, and the only date the
# panel takes from the clock rather than from this file. `end` is the last month
# held, so two roles that ran back to back meet on the axis with no gap.
#
# An entry with no `org` is a milestone, not a job: one point on the axis, no
# run, never the accent, and its `title` is set in the tier an employer would
# hold. That is what opens the axis before the first job.
#
# `title` is optional on a role too; the block then reads eyebrow and employer
# only. Both short blocks keep the tiers nearest the axis, so a label always
# starts where its drop line ends.
#
# Distance along the axis is time, so an entry missing or mis-spelling `start` is
# dropped rather than placed at the origin. Labels alternate above and below the
# axis and are clamped to the content column; about 30 characters of `title` fit
# before the clamp starts carrying a late role's label back off the right rail.

[[route]]
title = "first commit"
start = "2016-08"

[[route]]
org = "JP Morgan"
start = "2019-07"
end = "2020-12"

[[route]]
org = "Apple"
start = "2020-12"
end = "2022-01"

[[route]]
org = "Twilio"
start = "2022-01"
end = "2026-07"

[[route]]
org = "Machinify"
title = "platform engineer"
start = "2026-07"

# The `~/stack` roster lives in stack.json, not here. A category maps each tool
# to the height of its pedestal in the figure, which TOML can only express as a
# table per category.

# Curated, in display order. `repo` is owner/name; the language and last-push
# date come from the API at render time, so only the prose lives here. Set
# `language` to override what GitHub reports.
[[projects]]
repo = "ozzycodes2/cc-powerline"
name = "cc-powerline"
blurb = "A Claude Code status line for Powerline users: segments for model, context burn, git state and cost, rendered in the glyphs your prompt already uses."
tags = ["TypeScript", "CLI"]

[[projects]]
repo = "ozzycodes2/visualizer"
name = "visualizer"
blurb = "Step-through visualisation of pathfinding algorithms — A*, Dijkstra, BFS, DFS — on a grid you draw walls into."
tags = ["JavaScript", "Algorithms"]

[[projects]]
repo = "ozzycodes2/email-signatures"
name = "email-signatures"
blurb = "Hand-written HTML email signatures that survive Outlook, Gmail and the dark-mode inversion every client applies differently."
tags = ["HTML", "Email"]

[[projects]]
repo = "ozzycodes2/facebook-message-parser"
name = "facebook-message-parser"
blurb = "Turns a Facebook data export into readable, searchable HTML conversation history."
tags = ["Python", "HTML"]
language = "Python"   # GitHub reports CSS: the bundled stylesheet outweighs the script
