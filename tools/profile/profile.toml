# Hand-edited content for the profile README. Nothing here is fetched.
# Edit, push, and the Actions workflow re-renders the SVGs from it.

[identity]
name = "Osniel Quintana"
handle = "ozzycodes2"
role = "platform engineer"
# One line per rendered line. Keep each under ~72 characters or it will clip.
tagline = [
  "Backend by trade, platform by habit.",
  "Java, Rust, Python and TypeScript at the core,",
  "Kubernetes, Terraform and Argo in production, agents in the toolchain.",
  "I build the developer tooling other engineers ship on.",
]

[city]
# Days of contribution history the skyline draws. A tile is a fixed 44x22, so a
# longer window does not shrink the blocks — it widens the plane, and the plane
# is centred for 26 weeks. Much past 182 days it runs off the right rail.
#
# 180 keeps 1,301 of the year's 1,303 contributions and sits 11px left of
# centre. A full year would be two thirds bare ground and half of it off-frame.
window_days = 180

[stack]
Languages = ["Java", "Rust", "Python", "TypeScript", "Swift", "Shell"]
Platform = ["Kubernetes", "Terraform", "Helm", "ArgoCD", "Docker"]
Cloud = ["AWS", "EKS", "Grafana", "Prometheus"]
Tooling = ["Claude Code", "MCP", "Git", "Just", "Neovim"]

# Curated, in display order. `repo` is owner/name; the language and last-push
# date come from the API at render time, so only the prose lives here. Set
# `language` to override what GitHub reports.
[[projects]]
repo = "ozzycodes2/cc-powerline"
name = "cc-powerline"
blurb = "A Claude Code status line for Powerline users: segments for model, context burn, git state and cost, rendered in the glyphs your prompt already uses."
tags = ["TypeScript", "CLI"]

[[projects]]
repo = "ozzycodes2/visualizer"
name = "visualizer"
blurb = "Step-through visualisation of pathfinding algorithms — A*, Dijkstra, BFS, DFS — on a grid you draw walls into."
tags = ["JavaScript", "Algorithms"]

[[projects]]
repo = "ozzycodes2/email-signatures"
name = "email-signatures"
blurb = "Hand-written HTML email signatures that survive Outlook, Gmail and the dark-mode inversion every client applies differently."
tags = ["HTML", "Email"]

[[projects]]
repo = "ozzycodes2/facebook-message-parser"
name = "facebook-message-parser"
blurb = "Turns a Facebook data export into readable, searchable HTML conversation history."
tags = ["Python", "HTML"]
language = "Python"   # GitHub reports CSS: the bundled stylesheet outweighs the script
