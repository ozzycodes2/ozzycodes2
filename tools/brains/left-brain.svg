      from { stroke-dashoffset: 0 }
      to   { stroke-dashoffset: calc(-1 * var(--cycle) * 1px) }
    }
    @keyframes brain-drift {
      from { transform: translateX(0) }
      to   { transform: translateX(calc(var(--drift) * 1px)) }
    }
