name: Update profile

on:
  schedule:
    - cron: "41 11 * * *"           # daily, a few minutes off the hour so the
                                    # scheduler is not contending with everyone
  workflow_dispatch:                # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:                          # re-render immediately when the generator
      - "tools/profile/**"          # or the hand-written content changes
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write                   # the job commits the refreshed output

concurrency:
  group: update-profile             # never let two runs race on a push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit, not tag. A tag is a movable pointer, and retargeting
      # one at a malicious commit is how tj-actions/changed-files reached
      # ~23,000 repositories in March 2025 — the payload dumped every secret
      # the job could name into the log, which on a public repository is world
      # readable. Consumers pinned by SHA were unaffected. Comments record the
      # tag each SHA was taken from, since the SHA alone is unreadable.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Pinned: fontTools decides how the embedded font subsets are built, so
      # an unpinned upgrade would rewrite every SVG and produce a noise commit.
      - name: Install dependencies
        run: pip install fonttools==4.62.1 brotli==1.2.0

      # Both tokens are needed, for opposite reasons. github.token carries no
      # scopes, which is the only way to read how much of the year was private
      # — `read:user` zeroes that field. PROFILE_TOKEN carries `read:user` and
      # `repo`, which is what folds private repositories into the repo tally
      # and the language totals. Neither affects the contribution totals: those
      # come from the public profile page with no credential.
      - name: Fetch data
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/profile/fetch.py

      - name: Render SVGs
        run: python tools/profile/render.py

      - name: Update README
        run: python tools/profile/readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/profile/data assets README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: refresh profile"
          # A queued run checked out its SHA before the run ahead of it pushed,
          # so concurrency serializes the jobs but not their views of main.
          # Rebase: this commit is generated output, never a merge candidate.
          git pull --rebase --autostash origin main
          git push
